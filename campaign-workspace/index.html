<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Run Gullwatch Beacon, record what changed, save the campaign locally, and prepare the next session with a free system-neutral GM workspace.">
  <meta name="author" content="Loot Table Works">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#102b29">
  <link rel="canonical" href="https://loottableworks.github.io/loot-drop-calculator/campaign-workspace/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Loot Table Works">
  <meta property="og:title" content="Gullwatch Campaign Workspace | Free Local-First GM Tool">
  <meta property="og:description" content="Run a complete fantasy one-shot, record its consequences, and prepare the next session without an account or hosted campaign data.">
  <meta property="og:url" content="https://loottableworks.github.io/loot-drop-calculator/campaign-workspace/">
  <meta property="og:image" content="https://loottableworks.github.io/loot-drop-calculator/campaign-workspace/assets/gullwatch-beacon-cover-v1.png">
  <meta property="og:image:width" content="1600">
  <meta property="og:image:height" content="900">
  <meta property="og:image:alt" content="Gullwatch Beacon standing above a storm-dark coast, the setting for the free campaign workspace.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gullwatch Campaign Workspace">
  <meta name="twitter:description" content="Run tonight, record what changed, and prepare the next session in a free local-first GM workspace.">
  <meta name="twitter:image" content="https://loottableworks.github.io/loot-drop-calculator/campaign-workspace/assets/gullwatch-beacon-cover-v1.png">
  <title>Gullwatch Campaign Workspace | Loot Table Works</title>
  <link rel="stylesheet" href="styles.css?v=20260723-gullwatch-workspace-21">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Gullwatch Campaign Workspace",
      "description": "A free local-first workspace for running Gullwatch Beacon, recording campaign consequences, and preparing the next session.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "url": "https://loottableworks.github.io/loot-drop-calculator/campaign-workspace/",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Loot Table Works"
      }
    }
  </script>
</head>
<body>
  <header class="app-bar">
    <a class="brand" href="../" aria-label="Loot Table Works tools">
      <img src="assets/loot-table-works-avatar-512.png" alt="">
      <span><strong>Loot Table Works</strong><small>World Foundry</small></span>
    </a>
    <div class="campaign-identity">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="campaign-title">Gullwatch Campaign</span>
      <small id="save-status">Local save ready</small>
    </div>
    <div class="header-actions">
      <button id="open-campaign" class="quiet-action" type="button">Open</button>
      <button id="save-campaign" class="quiet-action" type="button">Save</button>
      <button id="reset-campaign" class="primary-action" type="button">New campaign</button>
      <input id="campaign-file" type="file" accept=".json,application/json" aria-label="Open campaign or faction state JSON" hidden>
    </div>
  </header>

  <section id="recovery-panel" class="recovery-panel" role="region" aria-labelledby="recovery-title" hidden>
    <div>
      <strong id="recovery-title">Local save recovery</strong>
      <p id="recovery-message"></p>
    </div>
    <div class="recovery-actions">
      <button id="download-recovery-data" type="button">Download unreadable data</button>
      <button id="copy-recovery-data" type="button">Copy unreadable data</button>
      <button id="replace-recovered-save" class="primary-action" type="button" disabled>Use recovered campaign</button>
    </div>
  </section>

  <div class="app-shell">
    <aside class="workspace-nav" aria-label="Campaign workspace">
      <div class="campaign-mark">
        <span>GW</span>
        <div>
          <strong>Signal at Gullwatch</strong>
          <small id="campaign-meta">Session 1 / Canon structure checked locally</small>
        </div>
      </div>
      <div class="workspace-nav-tabs">
        <button class="nav-scroll nav-scroll-previous" type="button" aria-label="Scroll workspace views left" aria-controls="workspace-tabs">&lsaquo;</button>
        <nav role="tablist" id="workspace-tabs" aria-label="Workspace views">
          <button id="workspace-tab-overview" type="button" role="tab" aria-selected="true" aria-controls="workspace-view" tabindex="0" data-view="overview">Overview</button>
          <button id="workspace-tab-brief" type="button" role="tab" aria-selected="false" aria-controls="workspace-view" tabindex="-1" data-view="brief">Next session</button>
          <button id="workspace-tab-record" type="button" role="tab" aria-selected="false" aria-controls="workspace-view" tabindex="-1" data-view="record">Record outcome</button>
          <button id="workspace-tab-timeline" type="button" role="tab" aria-selected="false" aria-controls="workspace-view" tabindex="-1" data-view="timeline">Timeline</button>
          <button id="workspace-tab-factions" type="button" role="tab" aria-selected="false" aria-controls="workspace-view" tabindex="-1" data-view="factions">Factions</button>
          <button id="workspace-tab-canon" type="button" role="tab" aria-selected="false" aria-controls="workspace-view" tabindex="-1" data-view="canon">Canon</button>
          <button id="workspace-tab-kit" type="button" role="tab" aria-selected="false" aria-controls="workspace-view" tabindex="-1" data-view="kit">Source kit</button>
          <button id="workspace-tab-field-test" type="button" role="tab" aria-selected="false" aria-controls="workspace-view" tabindex="-1" data-view="field-test">Field test</button>
        </nav>
        <button class="nav-scroll nav-scroll-next" type="button" aria-label="Scroll workspace views right" aria-controls="workspace-tabs">&rsaquo;</button>
      </div>
      <div class="nav-foot">
        <span id="entity-count">0 entities</span>
        <span id="event-count">0 events</span>
        <span class="verified">File structure checked locally</span>
      </div>
    </aside>

    <main id="workspace-view" role="tabpanel" aria-labelledby="workspace-tab-overview" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="campaign-workspace-data.js?v=20260723-gullwatch-workspace-21"></script>
  <script src="gullwatch-adventure-data.js?v=20260723-gullwatch-workspace-21"></script>
  <script src="campaign-workspace-runtime.js?v=20260723-gullwatch-workspace-21"></script>
  <script src="campaign-workspace-return-loop.js?v=20260723-gullwatch-workspace-21"></script>
  <script src="app.js?v=20260723-gullwatch-workspace-21"></script>
</body>
</html>
