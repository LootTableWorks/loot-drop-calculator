<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Foundry Item Catalog Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
      color: #20252b;
      background: #f3f5f7;
      --ink: #20252b;
      --muted: #66717c;
      --line: #d7dde3;
      --paper: #ffffff;
      --teal: #24616a;
      --red: #8b342a;
      --gold: #9b741d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-header {
      min-height: 76px;
      padding: 16px 22px;
      background: #20252b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
    .brand p { margin: 5px 0 0; color: #cbd2d9; font-size: 13px; }
    .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .button {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: var(--teal);
      color: #fff;
      font-weight: 700;
    }
    .button.secondary { background: #fff; color: var(--ink); border-color: var(--line); }
    .button.warn { background: var(--red); }
    .workspace {
      display: grid;
      grid-template-columns: 250px minmax(320px, 1fr) minmax(320px, 0.9fr);
      min-height: calc(100vh - 76px);
    }
    .filters, .results, .detail { min-width: 0; }
    .filters {
      padding: 18px;
      background: #e9edf0;
      border-right: 1px solid var(--line);
    }
    .results { padding: 18px; border-right: 1px solid var(--line); }
    .detail { padding: 18px; background: var(--paper); }
    h2 { margin: 0 0 14px; font-size: 17px; letter-spacing: 0; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: #46515c; }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid #bcc5ce;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
    }
    input:focus, select:focus, button:focus { outline: 3px solid rgba(36, 97, 106, 0.25); outline-offset: 1px; }
    .filter-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .count { color: var(--muted); font-size: 13px; }
    .item-list {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 150px);
      overflow: auto;
      padding-right: 4px;
    }
    .item-row {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }
    .item-row.has-icon { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px; }
    .list-icon { width: 48px; height: 48px; object-fit: contain; }
    .item-copy { min-width: 0; }
    .item-row:hover, .item-row.selected { border-color: var(--teal); background: #edf7f7; }
    .item-name { display: block; font-weight: 800; margin-bottom: 5px; overflow-wrap: anywhere; }
    .item-meta { display: block; color: var(--muted); font-size: 12px; text-transform: capitalize; }
    .empty { padding: 24px; border: 1px dashed #aeb8c1; color: var(--muted); text-align: center; }
    .detail-title { margin: 0 0 5px; font-size: 25px; overflow-wrap: anywhere; letter-spacing: 0; }
    .detail-id { color: var(--muted); font-family: Consolas, monospace; font-size: 12px; }
    .detail-identity { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .detail-icon { width: 148px; height: 148px; flex: none; object-fit: contain; padding: 6px; border: 1px solid var(--line); background: #eef2f2; }
    .detail-copy { min-width: 0; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
    .badge { padding: 5px 8px; border-radius: 4px; background: #edf0f2; font-size: 12px; text-transform: capitalize; }
    .badge.rarity { background: #fff1cf; color: #6d4f08; }
    .detail-block { margin: 18px 0; }
    .detail-block h3 { margin: 0 0 6px; color: var(--teal); font-size: 13px; letter-spacing: 0; text-transform: uppercase; }
    .detail-block p { margin: 0; line-height: 1.55; overflow-wrap: anywhere; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { padding: 10px; border: 1px solid var(--line); border-radius: 5px; }
    .stat span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .stat strong { display: block; margin-top: 5px; overflow-wrap: anywhere; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .notice { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    @media (max-width: 980px) {
      .workspace { grid-template-columns: 220px 1fr; }
      .detail { grid-column: 1 / -1; border-top: 1px solid var(--line); }
      .item-list { max-height: 520px; }
    }
    @media (max-width: 680px) {
      .app-header { align-items: flex-start; flex-direction: column; }
      .workspace { display: block; }
      .filters, .results { border-right: 0; border-bottom: 1px solid var(--line); }
      .item-list { max-height: 440px; }
      .stats { grid-template-columns: 1fr; }
      .header-actions, .detail-actions { width: 100%; }
      .header-actions .button, .detail-actions .button { flex: 1 1 140px; }
      .detail-identity { align-items: flex-start; }
      .detail-icon { width: 112px; height: 112px; }
    }
  </style>

<body>
  <header class="app-header">
    <div class="brand">
      <h1>World Foundry Item Catalog Demo</h1>
      <p>Search, inspect, randomize, and export 100 schema-v2 fantasy item records.</p>
    </div>
    <div class="header-actions">
      <button class="button secondary" id="exportJson">Export filtered JSON</button>
      <button class="button secondary" id="exportCsv">Export filtered CSV</button>
    </div>

  <main class="workspace">
    <aside class="filters">
      <h2>Find items</h2>
      <div class="field">
        <label for="search">Search</label>

      <div class="field"><label for="rarity">Rarity</label><select id="rarity"></select></div>

      <div class="field"><label for="objectType">Object type</label><select id="objectType"></select></div>
      <div class="field"><label for="stateFilter">State</label><select id="stateFilter"></select></div>
      <div class="field"><label for="craftingRole">Crafting role</label><select id="craftingRole"></select></div>
      <div class="filter-actions">
        <button class="button" id="random">Random</button>
        <button class="button warn" id="reset">Reset</button>
      </div>
      <p class="notice">Runs entirely offline. No account, analytics, or internet connection is required.</p>
    </aside>
    <section class="results">
      <div class="result-bar">
        <h2>Item library</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="item-list" id="itemList"></div>
    </section>
    <section class="detail" id="detail"></section>
  </main>

      renderDetail();
    }

    function download(name, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.hidden = true;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function csvCell(value) {
      const text = Array.isArray(value) ? value.join("|") : String(value ?? "");
      return '"' + text.replace(/"/g, '""') + '"';
    }

    document.querySelector("#exportJson").addEventListener("click", () =>
      download("loot-table-works-filtered-items.json", JSON.stringify(state.filtered, null, 2), "application/json")
    );
    document.querySelector("#exportCsv").addEventListener("click", () => {
      const headers = [...new Set(state.filtered.flatMap(item => Object.keys(item)))];
      const rows = [headers.map(csvCell).join(","), ...state.filtered.map(item => headers.map(key => csvCell(item[key])).join(","))];
      download("loot-table-works-filtered-items.csv", rows.join("\r\n"), "text/csv");
    });
    document.querySelector("#random").addEventListener("click", () => {
      if (!state.filtered.length) return;
      state.selectedId = state.filtered[Math.floor(Math.random() * state.filtered.length)].id;
      render();
    });
    document.querySelector("#reset").addEventListener("click", () => {
      controls.search.value = "";
      Object.keys(controls).filter(key => key !== "search").forEach(key => { controls[key].value = ""; });
      applyFilters();
    });
    Object.values(controls).forEach(control => control.addEventListener(control.tagName === "INPUT" ? "input" : "change", applyFilters));
    Object.keys(controls).filter(key => key !== "search").forEach(key => populateSelect(controls[key], key));
    render();
  </script>
</body>
</html>
